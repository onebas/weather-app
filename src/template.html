<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather | One</title>
</head>
<body>
    <header>
        <h1>OneWeather</h1>
        <button id="temp-format">
            <img src="./imgs/temperature-celsius.svg" alt="celsiusdegree-symbol">
        </button>
    </header>
    <main>
        <form action="#" method="get">
            <label for="city">Your City: </label>
            <input type="text" name="city" id="city" placeholder="For eg: London" required>
            <button type="submit">
                <img src="./imgs/search-web.svg" alt="search-icon">
            </button>
        </form>
        <div class="output">

        </div>
    </main>
    <footer>
        <p>By One</p>
    </footer>
</body>
</html>
